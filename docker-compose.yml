version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ntro_forensics_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ntro_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ntro_forensics_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ntro_net

networks:
  ntro_net:
    driver: bridge